[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "sh -c 'if [ -n \"$DATABASE_URL\" ]; then pnpm --filter api exec prisma migrate deploy; else echo \"Skipping migration: DATABASE_URL not set on this service\"; fi'"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

